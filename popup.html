<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <svg id="mascot" width="44" height="44" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <ellipse cx="50" cy="94" rx="30" ry="3" fill="#000" opacity="0.07"/>
    <ellipse cx="36" cy="84" rx="8" ry="5.5" fill="#4FB6B3" stroke="#1B2D4F" stroke-width="2.5"/>
    <ellipse cx="64" cy="84" rx="8" ry="5.5" fill="#4FB6B3" stroke="#1B2D4F" stroke-width="2.5"/>
    <rect x="20" y="20" width="60" height="60" rx="9" fill="#fff" stroke="#1B2D4F" stroke-width="2.5"/>
    <circle cx="38" cy="42" r="5.5" fill="#1B2D4F"/>
    <circle cx="62" cy="42" r="5.5" fill="#1B2D4F"/>
    <circle cx="40" cy="40" r="1.8" fill="#fff"/>
    <circle cx="64" cy="40" r="1.8" fill="#fff"/>
    <path d="M 40 58 Q 50 68 60 58" stroke="#1B2D4F" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </svg>
  <h1>Kororin</h1>
  <p class="tagline">Pick a vibe. We'll find you a repo.</p>

  <div class="modes">
    <button class="mode" data-mode="lucky">
      <span class="emoji">🍀</span>
      <span class="label">I'm Feeling Lucky</span>
      <span class="hint">Anywhere on GitHub</span>
    </button>
    <button class="mode" data-mode="words">
      <span class="emoji">✏️</span>
      <span class="label">Words</span>
      <span class="hint">Docs, typos, translations</span>
    </button>
    <button class="mode" data-mode="beginner">
      <span class="emoji">🌱</span>
      <span class="label">Beginner code</span>
      <span class="hint">Good first issues</span>
    </button>
    <button class="mode" data-mode="deeper">
      <span class="emoji">🔧</span>
      <span class="label">Deeper code</span>
      <span class="hint">Past your first PR</span>
    </button>
  </div>

  <div id="error" class="error hidden"></div>

  <script src="popup.js"></script>
</body>
</html>
